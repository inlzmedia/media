# Builds the media3 decoder extensions that need a manually built native
# library (ffmpeg, flac, av1, vp9) and publishes the resulting release AARs as a
# workflow artifact and as a draft GitHub Release.
#
# The modules and their build scripts are used exactly as committed: this
# workflow only prepares the external native sources and tooling, and patches
# nothing in the repository. Where a module hardcodes the ABI list, the extra
# ABIs are simply not packaged (see the AAR validation step).
#
# Trigger it manually from the Actions tab, or push a tag matching
# "decoder-build-*" (the tag suffix is used as the version).
name: Build decoder extensions

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in the AAR and release names.
        required: true
        default: 1.11.1
        type: string
      ffmpeg_decoders:
        description: Comma or space separated FFmpeg decoders to enable.
        required: true
        default: aac,aac_latm,mp3,flac,vorbis,ac3,eac3,alac,amrnb,amrwb,g711,g722
        type: string
      create_release:
        description: Create a draft GitHub Release with the AARs attached.
        required: true
        default: true
        type: boolean
  push:
    tags:
      - decoder-build-*

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  HOST_PLATFORM: linux-x86_64
  # NDK API level for FFmpeg. Must not exceed minSdk (23). The build script
  # always builds armeabi-v7a and arm64-v8a, and additionally x86 and x86_64.
  FFMPEG_ANDROID_ABI: "21"
  # ABIs that end up in the AARs. ffmpeg and vp9 hardcode their ABI list, and
  # the CMake modules are not restricted either, so the packaged set is
  # validated rather than configured.
  EXPECTED_ABIS: armeabi-v7a,arm64-v8a
  # External sources, pin them to change what gets built.
  FFMPEG_BRANCH: release/6.0
  FLAC_REF: ""
  DAV1D_REPO: https://code.videolan.org/videolan/dav1d.git
  LIBVPX_VERSION: v1.15.2
  # Space separated defaults, used when running from a tag.
  DEFAULT_FFMPEG_DECODERS: aac aac_latm mp3 flac vorbis ac3 eac3 alac amrnb amrwb g711 g722

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Resolve inputs
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_FFMPEG_DECODERS: ${{ github.event.inputs.ffmpeg_decoders }}
          INPUT_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          DEFAULT_FFMPEG_DECODERS: ${{ env.DEFAULT_FFMPEG_DECODERS }}
          EXPECTED_ABIS: ${{ env.EXPECTED_ABIS }}
        run: |
          set -eu
          tag_version=""
          if [[ "${GITHUB_REF}" == refs/tags/decoder-build-* ]]; then
            tag_version="${GITHUB_REF_NAME#decoder-build-}"
          fi
          version="${INPUT_VERSION:-${tag_version}}"
          if [[ -z "${version}" ]]; then
            echo "::error::Unable to determine the version to build."
            exit 1
          fi
          # The FFmpeg script takes the decoders as separate arguments.
          decoders="${INPUT_FFMPEG_DECODERS:-${DEFAULT_FFMPEG_DECODERS}}"
          decoders="$(echo "${decoders}" | tr ',' ' ')"
          read -r -a decoder_list <<< "${decoders}"
          ffmpeg_decoders="${decoder_list[*]}"
          if [[ -z "${ffmpeg_decoders}" ]]; then
            echo "::error::At least one FFmpeg decoder is required."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "ffmpeg_decoders=${ffmpeg_decoders}"
            echo "create_release=${INPUT_CREATE_RELEASE:-true}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Decoder build"
            echo "- version: \`${version}\`"
            echo "- ABIs: \`${EXPECTED_ABIS}\`"
            echo "- FFmpeg decoders: \`${ffmpeg_decoders}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default value is "tools platform-tools", but Google no longer
          # ships the "tools" package, which makes "sdkmanager tools" fail.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          {
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
            # Pin the NDK used by AGP instead of whatever the image ships.
            echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          } >> "${GITHUB_ENV}"

      - name: Install native build tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm yasm perl python3-pip
          sudo pip3 install --upgrade "meson>=0.63"

      - name: Fetch and build dav1d (av1)
        shell: bash
        run: |
          set -eu
          cd libraries/decoder_av1/src/main/jni
          git clone --depth=1 https://github.com/google/cpu_features
          git clone --depth=1 "${DAV1D_REPO}" dav1d
          # Builds every ABI listed in the script (arm and x86).
          ./build_dav1d.sh "$(pwd)/.." "${ANDROID_NDK_HOME}" "${HOST_PLATFORM}"

      - name: Fetch and build libvpx (vp9)
        shell: bash
        run: |
          set -eu
          cd libraries/decoder_vp9/src/main/jni
          git clone --depth=1 --branch "${LIBVPX_VERSION}" \
            https://chromium.googlesource.com/webm/libvpx
          # The script probes the host compiler with clang only flags, so its
          # "unrecognized command-line option" noise and the missing vp8_rtcd.h
          # (VP8 is disabled) are harmless. Do not rely on its exit code, check
          # the generated headers instead.
          ./generate_libvpx_android_configs.sh
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for header in vpx_config.h vp9_rtcd.h vpx_dsp_rtcd.h libvpx_srcs.txt; do
              if [[ ! -s "libvpx_android_configs/${abi}/${header}" ]]; then
                echo "::error::libvpx_android_configs/${abi}/${header} is missing."
                exit 1
              fi
            done
          done
          # Application.mk builds armeabi-v7a, x86, arm64-v8a and x86_64. The
          # module packages prebuilt libraries from src/main/libs, so send the
          # ndk-build output there. The module is selected through the
          # NDK_MODULE_NAME variable, a bare trailing name is not a make target.
          rm -rf ../libs
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            APP_APPLICATION_MK=./Application.mk \
            NDK_MODULE_NAME=libvpxV2JNI \
            NDK_LIBS_OUT="$(pwd)/../libs" \
            JNI_LIBS_OUT="$(pwd)/../libs" \
            -j"$(nproc)"
          ls -l ../libs/*/*.so

      - name: Fetch flac source
        shell: bash
        env:
          FLAC_REF: ${{ env.FLAC_REF }}
        run: |
          set -eu
          ref_args=()
          if [[ -n "${FLAC_REF}" ]]; then
            ref_args=(--branch "${FLAC_REF}")
          fi
          git clone --depth=1 "${ref_args[@]}" https://github.com/xiph/flac.git \
            libraries/decoder_flac/src/main/jni/libflac
          git -C libraries/decoder_flac/src/main/jni/libflac log --oneline -1

      - name: Fetch and build FFmpeg (ffmpeg)
        shell: bash
        env:
          FFMPEG_DECODERS: ${{ steps.resolve.outputs.ffmpeg_decoders }}
          FFMPEG_BRANCH: ${{ env.FFMPEG_BRANCH }}
        run: |
          set -eu
          cd libraries/decoder_ffmpeg/src/main/jni
          git clone --depth=1 --branch "${FFMPEG_BRANCH}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg
          # shellcheck disable=SC2086 # The decoder list must be word split.
          ./build_ffmpeg.sh "$(pwd)/.." "${ANDROID_NDK_HOME}" "${HOST_PLATFORM}" \
            "${FFMPEG_ANDROID_ABI}" ${FFMPEG_DECODERS}

      - name: Build release AARs
        shell: bash
        run: |
          set -eu
          # libopus is left out: upstream libopus currently fails to link its
          # arm64 NEON FFT assembly into a shared library
          # ("R_AARCH64_ADR_PREL_PG_HI21 ... celt_tx_tab_53").
          ./gradlew --no-daemon \
            :lib-decoder-ffmpeg:assembleRelease \
            :lib-decoder-flac:assembleRelease \
            :lib-decoder-av1:assembleRelease \
            :lib-decoder-vp9:assembleRelease

      - name: Collect and validate AARs
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          EXPECTED_ABIS: ${{ env.EXPECTED_ABIS }}
        run: |
          set -eu
          ignore_abis="x86,x86_64"
          # buildDir is redirected to buildout in gradle.properties.
          staging="staging"
          mkdir -p "${staging}"
          aars=()
          for aar in libraries/decoder_*/buildout/outputs/aar/*-release.aar; do
            module="$(basename "$(dirname "$(dirname "$(dirname "$aar")")")")"
            case "${module}" in
              decoder_ffmpeg|decoder_flac|decoder_av1|decoder_vp9) ;;
              *) continue ;;
            esac
            name="media3-${module//_/-}-${VERSION}.aar"
            cp "${aar}" "${staging}/${name}"
            aars+=("${staging}/${name}")
            {
              echo "### ${name}"
              echo '```'
              unzip -l "${staging}/${name}" | grep -E 'jni/|classes.jar' || true
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done
          if [[ ${#aars[@]} -ne 4 ]]; then
            echo "::error::Expected 4 release AARs, collected ${#aars[@]}."
            find libraries -path '*buildout/outputs/aar*' -name '*.aar' || true
            exit 1
          fi
          for aar in "${aars[@]}"; do
            packaged_abis="$(
              unzip -Z1 "${aar}" \
                | sed -n 's#^jni/\([^/]*\)/.*$#\1#p' \
                | sort -u | paste -sd, -
            )"
            # ffmpeg and vp9 hardcode the ABI list, so the arm ABIs are packaged
            # next to x86 ones. Only x86 and x86_64 are dropped from the release.
            for abi in ${ignore_abis//,/ }; do
              if [[ ",${packaged_abis}," == *",${abi},"* ]]; then
                # Delete the .so and the ABI directory entry from the archive.
                zip -q -d "${aar}" "jni/${abi}/lib*.so" "jni/${abi}/" || true
              fi
            done
            packaged_abis="$(
              unzip -Z1 "${aar}" \
                | sed -n 's#^jni/\([^/]*\)/.*$#\1#p' \
                | sort -u | paste -sd, -
            )"
            if [[ "${packaged_abis}" != "${EXPECTED_ABIS}" ]]; then
              echo "::error::${aar} contains [${packaged_abis}] instead of [${EXPECTED_ABIS}]."
              exit 1
            fi
            echo "${aar}: ${packaged_abis}"
          done

      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-aars-${{ steps.resolve.outputs.version }}
          path: staging/*.aar
          if-no-files-found: error

      - name: Create draft release
        if: steps.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        with:
          tag_name: media3-decoders-v${{ steps.resolve.outputs.version }}
          name: media3 decoder extensions v${{ steps.resolve.outputs.version }}
          body: |
            Release AARs for the media3 decoder extensions.

            - Built from `${{ github.sha }}`
            - ABIs: `${{ env.EXPECTED_ABIS }}`
            - FFmpeg decoders: `${{ steps.resolve.outputs.ffmpeg_decoders }}`

            The AARs depend on the matching `androidx.media3` release
            (`${{ steps.resolve.outputs.version }}`). FFmpeg, libflac, dav1d and
            libvpx are licensed separately, see each module's README.

            `media3-decoder-opus` is not part of this release.
          files: staging/*.aar
          draft: true
