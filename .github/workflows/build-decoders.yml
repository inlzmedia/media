# Builds the media3 decoder extensions that require a manual native build
# (ffmpeg, flac, opus, av1, vp9) and publishes the resulting release AARs.
#
# Trigger it manually from the Actions tab, or push a tag matching
# "decoder-build-*" (the tag suffix is used as the version).
name: Build decoder extensions

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in the artifact/release file names.
        required: true
        default: 1.11.1
        type: string
      ffmpeg_decoders:
        description: Comma or space separated FFmpeg decoders to enable.
        required: true
        default: aac,aac_latm,mp3,flac,opus,vorbis,ac3,eac3,alac,amrnb,amrwb,g711,g722
        type: string
      target_abis:
        description: Comma separated Android ABIs to build and package.
        required: true
        default: arm64-v8a,armeabi-v7a
        type: string
      create_release:
        description: Create a draft GitHub Release with the AARs attached.
        required: true
        default: true
        type: boolean
  push:
    tags:
      - decoder-build-*

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  HOST_PLATFORM: linux-x86_64
  # NDK API level used when building FFmpeg, read by the "Resolve inputs" step.
  # It must not exceed minSdk (23).
  FFMPEG_ANDROID_ABI: "21"
  # Only the arm ABIs are built; set to 1 to also build x86 and x86_64.
  BUILD_X86_ABIS: "0"
  # Official dav1d repository. Override here if it becomes unreachable.
  DAV1D_REPO: https://code.videolan.org/videolan/dav1d.git
  # Tagged revision of libvpx used by the vp9 module.
  LIBVPX_VERSION: v1.15.2
  # Space separated FFmpeg decoders, derived from the workflow inputs.
  DEFAULT_FFMPEG_DECODERS: aac aac_latm mp3 flac opus vorbis ac3 eac3 alac amrnb amrwb g711 g722
  # Space separated ABIs, derived from the workflow inputs.
  DEFAULT_TARGET_ABIS: arm64-v8a armeabi-v7a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Resolve inputs
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_FFMPEG_DECODERS: ${{ github.event.inputs.ffmpeg_decoders }}
          INPUT_TARGET_ABIS: ${{ github.event.inputs.target_abis }}
          INPUT_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          DEFAULT_FFMPEG_DECODERS: ${{ env.DEFAULT_FFMPEG_DECODERS }}
          DEFAULT_TARGET_ABIS: ${{ env.DEFAULT_TARGET_ABIS }}
          FFMPEG_ANDROID_ABI: ${{ env.FFMPEG_ANDROID_ABI }}
        run: |
          set -eu
          tag_version=""
          if [[ "${GITHUB_REF}" == refs/tags/decoder-build-* ]]; then
            tag_version="${GITHUB_REF_NAME#decoder-build-}"
          fi
          version="${INPUT_VERSION:-${tag_version}}"
          if [[ -z "${version}" ]]; then
            echo "::error::Unable to determine the version to build."
            exit 1
          fi
          # Inputs accept commas and/or spaces as separators, the scripts need spaces.
          decoders="${INPUT_FFMPEG_DECODERS:-${DEFAULT_FFMPEG_DECODERS}}"
          decoders="$(echo "${decoders}" | tr ',' ' ')"
          decoders="${decoders//$'\n'/ }"
          read -r -a decoder_list <<< "${decoders}"
          ffmpeg_decoders="${decoder_list[*]}"
          abis="${INPUT_TARGET_ABIS:-${DEFAULT_TARGET_ABIS}}"
          abis="$(echo "${abis}" | tr ',' ' ')"
          abis="${abis//$'\n'/ }"
          read -r -a abi_list <<< "${abis}"
          target_abis="${abi_list[*]}"
          target_abis_csv="${target_abis// /,}"
          for abi in "${abi_list[@]}"; do
            case "${abi}" in
              arm64-v8a|armeabi-v7a|x86|x86_64) ;;
              *)
                echo "::error::Unsupported ABI '${abi}'."
                exit 1
                ;;
            esac
          done
          if [[ -z "${ffmpeg_decoders}" ]]; then
            echo "::error::At least one FFmpeg decoder is required."
            exit 1
          fi
          create_release="${INPUT_CREATE_RELEASE:-true}"
          {
            echo "version=${version}"
            echo "ffmpeg_decoders=${ffmpeg_decoders}"
            echo "ffmpeg_android_abi=${FFMPEG_ANDROID_ABI}"
            echo "target_abis=${target_abis}"
            echo "target_abis_csv=${target_abis_csv}"
            echo "create_release=${create_release}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Decoder build"
            echo "- version: \`${version}\`"
            echo "- ABIs: \`${target_abis}\`"
            echo "- FFmpeg decoders: \`${ffmpeg_decoders}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install native build tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm yasm perl python3-pip
          sudo pip3 install --upgrade "meson>=0.63"

      - name: Fetch and build dav1d (av1)
        shell: bash
        env:
          TARGET_ABIS: ${{ steps.resolve.outputs.target_abis }}
        run: |
          set -eu
          cd libraries/decoder_av1/src/main/jni
          git clone --depth=1 https://github.com/google/cpu_features
          git clone --depth=1 "${DAV1D_REPO}" dav1d
          ./build_dav1d.sh "$(pwd)/.." "${ANDROID_NDK_HOME}" "${HOST_PLATFORM}"

      - name: Fetch and build libvpx (vp9)
        shell: bash
        env:
          TARGET_ABIS: ${{ steps.resolve.outputs.target_abis }}
        run: |
          set -eu
          cd libraries/decoder_vp9/src/main/jni
          git clone --depth=1 --branch "${LIBVPX_VERSION}" \
            https://chromium.googlesource.com/webm/libvpx
          ./generate_libvpx_android_configs.sh
          # libvpx_android_configs holds every ABI; only build the requested ones.
          abi_list="$(echo "${TARGET_ABIS}" | tr ' ' ',')"
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            APP_APPLICATION_MK=./Application.mk \
            APP_ABI="${abi_list}" \
            -j"$(nproc)"

      - name: Fetch flac and opus sources
        shell: bash
        run: |
          set -eu
          git clone --depth=1 https://github.com/xiph/flac.git \
            libraries/decoder_flac/src/main/jni/libflac
          git clone --depth=1 https://github.com/xiph/opus.git \
            libraries/decoder_opus/src/main/jni/libopus

      - name: Fetch and build FFmpeg (ffmpeg)
        shell: bash
        env:
          FFMPEG_DECODERS: ${{ steps.resolve.outputs.ffmpeg_decoders }}
          FFMPEG_ANDROID_ABI: ${{ steps.resolve.outputs.ffmpeg_android_abi }}
          TARGET_ABIS: ${{ steps.resolve.outputs.target_abis }}
        run: |
          set -eu
          if [[ "${TARGET_ABIS}" != "arm64-v8a armeabi-v7a" ]]; then
            echo "::warning::Only arm64-v8a and armeabi-v7a are supported for FFmpeg, the '${TARGET_ABIS}' input is not applied."
          fi
          cd libraries/decoder_ffmpeg/src/main/jni
          git clone --depth=1 --branch release/6.0 \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg
          # shellcheck disable=SC2086 # The decoder list must be word split.
          ./build_ffmpeg.sh "$(pwd)/.." "${ANDROID_NDK_HOME}" "${HOST_PLATFORM}" \
            "${FFMPEG_ANDROID_ABI}" ${FFMPEG_DECODERS}

      - name: Build release AARs
        shell: bash
        env:
          TARGET_ABIS: ${{ steps.resolve.outputs.target_abis }}
          TARGET_ABIS_CSV: ${{ steps.resolve.outputs.target_abis_csv }}
        run: |
          set -eu
          gradle_args=()
          if [[ "${TARGET_ABIS}" == "arm64-v8a armeabi-v7a" ]]; then
            # FFmpeg only has pre-built binaries for the arm ABIs.
            gradle_args+=("-Pmedia3.abiFilters=${TARGET_ABIS_CSV}")
          else
            echo "::warning::Not restricting Gradle to ${TARGET_ABIS}; the FFmpeg AAR keeps the arm ABIs only."
          fi
          ./gradlew --no-daemon \
            :lib-decoder-ffmpeg:assembleRelease \
            :lib-decoder-flac:assembleRelease \
            :lib-decoder-opus:assembleRelease \
            :lib-decoder-av1:assembleRelease \
            :lib-decoder-vp9:assembleRelease \
            "${gradle_args[@]}"

      - name: Collect AARs
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TARGET_ABIS_CSV: ${{ steps.resolve.outputs.target_abis_csv }}
        run: |
          set -eu
          mkdir -p staging
          modules=(decoder_ffmpeg decoder_flac decoder_opus decoder_av1 decoder_vp9)
          for module in "${modules[@]}"; do
            # buildDir is redirected to buildout in gradle.properties.
            aar="$(find "libraries/${module}/buildout/outputs/aar" -name '*-release.aar' -type f | sort | head -n 1)"
            if [[ -z "${aar}" ]]; then
              echo "::error::No release AAR found for ${module}."
              exit 1
            fi
            staged="staging/media3-${module//_/-}-${VERSION}.aar"
            cp "${aar}" "${staged}"
            echo "${staged}"
            unzip -l "${staged}" | grep 'jni/'
            packaged_abis="$(unzip -Z1 "${staged}" | sed -n 's#^jni/\([^/]*\)/.*$#\1#p' | sort -u)"
            if [[ "${packaged_abis//$'\n'/,}" != "${TARGET_ABIS_CSV}" ]]; then
              echo "::error::${staged} contains [${packaged_abis//$'\n'/,}] instead of [${TARGET_ABIS_CSV}]."
              exit 1
            fi
          done

      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-aars-${{ steps.resolve.outputs.version }}
          path: staging/*.aar
          if-no-files-found: error

      - name: Create draft release
        if: steps.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        with:
          tag_name: media3-decoders-v${{ steps.resolve.outputs.version }}
          name: media3 decoder extensions v${{ steps.resolve.outputs.version }}
          body: |
            Release AARs for the media3 decoder extensions.

            - Built from `${{ github.sha }}`
            - ABIs: `${{ steps.resolve.outputs.target_abis }}`
            - FFmpeg decoders: `${{ steps.resolve.outputs.ffmpeg_decoders }}`

            The AARs depend on the matching `androidx.media3` release
            (`${{ steps.resolve.outputs.version }}`). FFmpeg, libflac, libopus,
            dav1d and libvpx are licensed separately, see each module's README.
          files: staging/*.aar
          draft: true
